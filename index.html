<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scribl - Note Taking Web App</title>
  <link rel="icon" href="./assets/notes.ico" type="image/png">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo-container">
      <img src="./assets/notes.png" alt="Scribl Logo" class="logo-icon">
      <h1>Scribl</h1>
    </div>

    <div class="header-actions">
      <div class="export-controls">
        <button id="export-pdf" class="icon-btn custom-font"><i class="fas fa-file-pdf"></i>Export as PDF</button>
        <button id="export-jpg" class="icon-btn custom-font"><i class="fas fa-file-image"></i>Export as JPG</button>
      </div>

      <!-- Settings Dropdown -->
      <div class="settings-container">
        <button id="settings-btn" class="icon-btn custom-font"><i class="fas fa-cog"></i> Settings</button>

        <div id="settings-panel" class="settings-panel hidden">
          <div class="setting-item">
            <span>Theme Mode</span>
            <button id="toggle-dark" class="icon-btn custom-font"><i
                class="hgi hgi-stroke hgi-rounded hgi-moon-02"></i></button>
          </div>
          <div class="setting-item">
            <span>Theme Color</span>
            <input type="color" id="theme-color" value="#4F46E5" title="Change Theme Color">
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="app-container">
    <aside>
      <input type="text" id="search-tags" placeholder="Filter by tags...">
      <div id="notes-list"></div>
    </aside>
    <main>
      <div class="editor-header">
        <input type="text" id="note-title" placeholder="Note Title...">
        <button id="new-note" class="secondary-btn custom-font"><i class="fas fa-plus"></i> New Note</button>
      </div>
      <input type="text" id="note-tags" placeholder="Tags (comma separated)">

      <!-- Quill Editor Div -->
      <div id="editor"></div>

      <button id="save-note" class="primary-btn"><i class="fas fa-save"></i> Save Note</button>
    </main>
  </div>

  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
